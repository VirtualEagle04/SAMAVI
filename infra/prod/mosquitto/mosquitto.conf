# Mosquitto de producción. El de desarrollo (anónimo, sin TLS) está en infra/mosquitto/.
# Contrato y permisos: docs/protocols/mqtt.md.

per_listener_settings false
allow_anonymous false
# Ambos viven en el volumen mosquitto_auth con dueño 1883 (scripts/lib.sh).
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Red interna de Docker (backend). No se publica en el host.
listener 1883

# ESP32 desde Internet. Certificado de Let's Encrypt copiado por certbot/deploy-hook.sh.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
