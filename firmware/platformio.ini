; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
lib_deps = 
	knolleary/PubSubClient @ ^2.8
	adafruit/Adafruit_VL53L0X@^1.2.5
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.12.1

; Prueba de la pantalla TFT ST7789 (240x320) con el conteo local por categoría.
; pio run -e tft_test -t upload
[env:tft_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_tft.cpp>
lib_deps =
	adafruit/Adafruit_VL53L0X@^1.2.5
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.12.1

; Diagnóstico de los VL53L0X (direcciones, lecturas y reinicios), sin Wi-Fi ni MQTT.
; pio run -e sensores_test -t upload
[env:sensores_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_sensores.cpp>
lib_deps =
	adafruit/Adafruit_VL53L0X@^1.2.5
