; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Versión fija (Arduino-ESP32 2.0.17): con espressif32 8.x (Arduino 3.x) el
; firmware con TLS no cabe en la partición de 1,25 MB. Todos los entornos la heredan.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
lib_deps = 
	knolleary/PubSubClient @ ^2.8
	adafruit/Adafruit_VL53L0X@^1.2.5
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.12.1

; Prueba de la pantalla TFT ST7789 (240x320) con el conteo local por categoría.
; pio run -e tft_test -t upload
[env:tft_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_tft.cpp>
lib_deps =
	adafruit/Adafruit_VL53L0X@^1.2.5
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.12.1

; Diagnóstico de los VL53L0X (direcciones, lecturas y reinicios), sin Wi-Fi ni MQTT.
; pio run -e sensores_test -t upload
[env:sensores_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_sensores.cpp>
lib_deps =
	adafruit/Adafruit_VL53L0X@^1.2.5

; Dos OLED SSD1306 directas al ESP32, sin multiplexor: OLED 1 en SDA 21 / SCL 22 y
; OLED 2 en SDA 25 / SCL 26 (segundo bus I2C, porque las dos usan 0x3C).
; pio run -e oled_test -t upload
[env:oled_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_oled.cpp>
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.12.1

; Multiplexor PCA9548A (HW-617) con una OLED en el canal 0 y, opcional, otra en el canal 1.
; pio run -e mux_test -t upload
[env:mux_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_mux.cpp>
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.12.1

; Seis VL53L0X y TFT de main.cpp más el multiplexor con dos OLED, sin Wi-Fi ni MQTT.
; pio run -e integracion_test -t upload
[env:integracion_test]
extends = env:esp32dev
build_src_filter = -<*> +<main_test_integracion.cpp>
lib_deps =
	adafruit/Adafruit_VL53L0X@^1.2.5
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.12.1

